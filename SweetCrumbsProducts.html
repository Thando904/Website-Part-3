<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sweet Crumbs Bakery Products - Fresh breads, pastries, cakes, and more.">
  <title>Products - Sweet Crumbs Bakery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Sweet Crumbs Bakery</div>

    <div class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="SweetCrumbsHomepage.html">Home</a></li>
        <li><a href="SweetCrumbsAboutUs.html">About Us</a></li>
        <li><a href="SweetCrumbsProducts.html" class="active">Products</a></li>
        <li><a href="SweetCrumbsEnquiry.html">Enquiry</a></li>
        <li><a href="SweetCrumbsContactPage.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section class="products-gallery">
      <h2>Our Delicious Products</h2>
      <div class="product-images">
        <div class="product-item">
          <img src="images/bread.jpg.png" alt="Freshly baked bread loaf">
          <p class="product-name">Freshly Baked Bread Loaf</p>
          <p class="product-price">R25.00 - R100.00</p>
        </div>
        <div class="product-item">
          <img src="images/Pastry.jpg.png" alt="Assorted pastries">
          <p class="product-name">Assorted Pastries</p>
          <p class="product-price">R30.00 - R350.00</p>
        </div>
        <div class="product-item">
          <img src="images/Custom.jpg.png" alt="Custom orders">
          <p class="product-name">Custom Orders</p>
          <p class="product-price">Prices Vary</p>
        </div>
        <div class="product-item">
          <img src="images/Cake.jpg.png" alt="Cakes & cupcakes with frosting">
          <p class="product-name">Cakes & Cupcakes</p>
          <p class="product-price">R50.00 - R200.00</p>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Sweet Crumbs Bakery | Soweto</p>
  </footer>

  <!-- JAVASCRIPT -->
  <script src="javascript/nav.js"></script>
</body>
</html>
