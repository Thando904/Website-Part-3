<script defer src="javascript/form-validation.js"></script>
<body>
  <!-- HEADER -->
  <header>
    <h1>Sweet Crumbs Bakery</h1>
    <nav>
      <ul>
        <li><a href="Sweet Crumbs Homepage.html">Home</a></li>
        <li><a href="Sweet crumbs About Us.html">About Us</a></li>
        <li><a href="Sweet Crumbs Products & Services.html">Products</a></li>

        <li><a href="Sweet Crumbs Contact Page.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section>
      <h2>Get in Touch</h2>
      <p><strong>Location 1:</strong> Vilakazi Street, Soweto</p>
      <p><strong>Location 2:</strong> Maponya Mall, Soweto</p>
      <p><strong>Phone:</strong> +27 11 123 4567</p>
      <p><strong>Email:</strong> info@sweetcrumbs.co.za</p>
    </section>

    <section>
      <h3>Send us a message</h3>
      <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Sweet Crumbs Bakery | Soweto</p>
  </footer>
