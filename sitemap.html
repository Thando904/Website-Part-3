<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sitemap / Map - Sweet Crumbs Bakery</title>
  <meta name="description" content="Sitemap page showing an interactive map of Maponya Mall and Vilakazi Street in Soweto." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: Arial; margin:0; }
    header { background:#c84b31; color:#fff; padding:1rem; }
    main { padding:1rem; max-width:1100px; margin:auto; }
    #map { width:100%; height:500px; border:1px solid #ddd; border-radius:6px; }
    .sitemap-links a { margin-right:1rem; color:#c84b31; text-decoration:none; }
  </style>
</head>

<body>
  <header>
    <h1>Sitemap & Location — Sweet Crumbs Bakery</h1>
  </header>

  <main>
    <p>This map shows the locations of <strong>Maponya Mall</strong> and <strong>Vilakazi Street</strong> in Soweto.</p>

    <div id="map"></div>

    <h2>Sitemap Links</h2>
    <div class="sitemap-links">
      <a href="Sweet Crumbs Homepage.html">Home</a>
      <a href="Sweet crumbs About us.html">About</a>
      <a href="Sweet Crumbs Products & Services.html">Products & Services</a>
      <a href="Sweet crumbs Contact Page.html">Contact</a>
      <a href="Sweet Crumbs Enquiry.html">Enquiry</a>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Accurate coordinates for your two destinations
    const locations = [
      {
        name: "Maponya Mall",
        lat: -26.2587,
        lng: 27.9009
      },
      {
        name: "Vilakazi Street, Soweto",
        lat: -26.2386,
        lng: 27.9088
      }
    ];

    // Center map between both locations
    const map = L.map('map').setView([-26.2485, 27.9045], 14);

    // Add map tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    // Add markers for each location
    locations.forEach(location => {
      L.marker([location.lat, location.lng])
        .addTo(map)
        .bindPopup(`<strong>${location.name}</strong>`);
    });
  </script>

</body>
</html>
